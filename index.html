<!DOCTYPE html>
<html lang="km">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ទំព័រដើម - My Personal Space</title>
    <!-- Google Fonts -->
    <link
        href="https://fonts.googleapis.com/css2?family=Kantumruuy+Pro:wght@300;400;600;700&family=Poppins:wght@300;400;600;700&display=swap"
        rel="stylesheet">
    <!-- Font Awesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="style.css">

    <!-- CSS ផ្ទាល់សម្រាប់ទំព័រ index (រូបធំខ្លាំង គ្មានរង្វង់មូល និងគ្មានបន្ទាត់ខាងក្រោម) -->
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Poppins', 'Kantumruuy Pro', sans-serif;
        }

        :root {
            --primary-sky: #00d2ff;
            --secondary-sky: #3a7bd5;
            --bg-dark: #0a1118;
            --text-color: #e6f1ff;
            --accent-glow: rgba(0, 210, 255, 0.6);
        }

        body,
        body.dark-mode {
            background-color: var(--bg-dark, #0a1118) !important;
            color: var(--text-color, #e6f1ff) !important;
            min-height: 100vh;
            overflow-x: hidden;
            position: relative;
        }

        #bg-canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
            pointer-events: none;
        }

        .hero {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 120px 8% 40px 8%;
            flex-wrap: wrap;
            gap: 40px;
            position: relative;
            z-index: 1;
        }

        .hero-content {
            max-width: 600px;
            animation: fadeInLeft 1s ease-in-out;
        }

        @keyframes fadeInLeft {
            from { opacity: 0; transform: translateX(-40px); }
            to { opacity: 1; transform: translateX(0); }
        }

        .welcome-badge {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            background: rgba(0, 210, 255, 0.1);
            border: 1px solid rgba(0, 210, 255, 0.4);
            padding: 8px 18px;
            border-radius: 30px;
            font-size: 0.92rem;
            color: var(--primary-sky);
            margin-bottom: 20px;
            box-shadow: 0 0 20px rgba(0, 210, 255, 0.3);
        }

        .main-title {
            font-size: 3.2rem;
            font-weight: 700;
            color: #ffffff;
            line-height: 1.2;
            margin-bottom: 10px;
        }

        .gradient-name {
            background: linear-gradient(135deg, #00d2ff, #3a7bd5, #ffffff);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-shadow: 0 0 35px rgba(0, 210, 255, 0.6);
            font-weight: 800;
        }

        .sub-title {
            font-size: 1.5rem;
            font-weight: 600;
            color: #a8b2d1;
            margin-bottom: 20px;
        }

        .hero-description {
            color: #8892b0;
            font-size: 1.05rem;
            line-height: 1.7;
            margin-bottom: 30px;
        }

        .btn-group {
            display: flex;
            gap: 15px;
            margin-bottom: 25px;
        }

        .btn {
            display: inline-block;
            padding: 12px 28px;
            border-radius: 25px;
            text-decoration: none;
            font-weight: 600;
            transition: all 0.3s ease;
        }

        .btn-primary {
            background: linear-gradient(45deg, var(--primary-sky), var(--secondary-sky));
            color: #fff;
            box-shadow: 0 4px 20px var(--accent-glow);
        }

        .btn-primary:hover {
            transform: translateY(-3px);
            box-shadow: 0 6px 25px rgba(0, 210, 255, 0.8);
        }

        .btn-secondary {
            border: 2px solid var(--primary-sky);
            color: var(--primary-sky);
            background: rgba(0, 210, 255, 0.05);
        }

        .btn-secondary:hover {
            background: var(--primary-sky);
            color: #0a1118;
            transform: translateY(-3px);
            box-shadow: 0 5px 20px rgba(0, 210, 255, 0.5);
        }

        .hero-socials {
            display: flex;
            gap: 15px;
        }

        .hero-socials a {
            display: inline-flex;
            justify-content: center;
            align-items: center;
            width: 44px;
            height: 44px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(0, 210, 255, 0.4);
            color: var(--primary-sky);
            font-size: 1.2rem;
            text-decoration: none;
            transition: all 0.3s ease;
        }

        .hero-socials a:hover {
            background: var(--primary-sky);
            color: #0a1118;
            transform: translateY(-5px);
            box-shadow: 0 0 20px var(--primary-sky);
        }

        /* ផ្នែករូបភាពប្រូហ្វាលធំខ្លាំង គ្មានរង្វង់មូល និងគ្មានបន្ទាត់ */
        .hero-img {
            text-align: center;
            animation: fadeInRight 1s ease-in-out;
        }

        @keyframes fadeInRight {
            from { opacity: 0; transform: translateX(40px); }
            to { opacity: 1; transform: translateX(0); }
        }

        .profile-container {
            display: inline-block;
            position: relative;
        }

        .profile-img {
            width: 480px; /* ពង្រីកទំហំទទឹងឱ្យធំខ្លាំងពេញចិត្ត */
            height: auto;  /* រក្សាសមាមាត្ររូបភាពពិត មិនឱ្យបាក់ទម្រង់ */
            border-radius: 0; /* ដកចេញនូវរង្វង់មូលទាំងស្រុង */
            border: none;     /* ដកស៊ុមចេញ */
            background: transparent;
            object-fit: contain;
            filter: drop-shadow(0 0 30px rgba(0, 210, 255, 0.5)); /* ពន្លឺ Neon Glow ជុំវិញរូប */
            animation: floatAvatar 4s ease-in-out infinite alternate;
        }

        @keyframes floatAvatar {
            0% { transform: translateY(0px); }
            100% { transform: translateY(-12px); }
        }

        @media (max-width: 900px) {
            .hero {
                flex-direction: column-reverse;
                text-align: center;
                justify-content: center;
            }
            .hero-content {
                max-width: 100%;
            }
            .btn-group, .hero-socials {
                justify-content: center;
            }
            .profile-img {
                width: 320px; /* ទំហំសមស្របសម្រាប់អេក្រង់ទូរស័ព្ទ */
            }
        }
    </style>
</head>

<body class="dark-mode">
    <!-- Background Particle Canvas -->
    <canvas id="bg-canvas"></canvas>

    <!-- ទីតាំង Fetch Header -->
    <div id="header-container"></div>

    <!-- Hero Section -->
    <section id="home" class="hero">
        <div class="hero-content">
            <div class="welcome-badge">
                <i class="fa-solid fa-sparkles"></i> <span>ស្វាគមន៍មកកាន់ពិភពឌីជីថលរបស់ខ្ញុំ</span>
            </div>

            <h1 class="main-title">
                សួស្តី! ខ្ញុំឈ្មោះ <span class="gradient-name">CHHENG</span>
            </h1>

            <h2 class="sub-title">
                <span class="typing-text">Web & Software Developer</span> 💻✨
            </h2>

            <p class="hero-description">
                ខ្ញុំជាអ្នកអភិវឌ្ឍន៍វេបសាយដែលមានចំណង់ចំណូលចិត្តខ្លាំងលើការបង្កើត UI/UX ស្អាតៗ មានចលនារស់រវើក
                និងបទពិសោធន៍ប្រើប្រាស់រលូន។
            </p>

            <div class="btn-group">
                <a href="More/projects.html" class="btn btn-primary glow-btn">
                    <i class="fa-solid fa-code"></i> View My Work
                </a>
                <a href="More/contact.html" class="btn btn-secondary">
                    <i class="fa-solid fa-paper-plane"></i> Contact Me
                </a>
            </div>

            <!-- Social Media Icons -->
            <div class="hero-socials">
                <a href="https://github.com" target="_blank"><i class="fa-brands fa-github"></i></a>
                <a href="https://t.me/CHHENG55" target="_blank"><i class="fa-brands fa-telegram"></i></a>
                <a href="https://facebook.com" target="_blank"><i class="fa-brands fa-facebook"></i></a>
            </div>
        </div>

        <!-- រូបភាពប្រូហ្វាលធំខ្លាំង គ្មានរង្វង់មូល និងគ្មានបន្ទាត់ខាងក្រោម -->
        <div class="hero-img">
            <div class="profile-container">
                <img src="img/img1.png" alt="CHHENG Profile" class="profile-img">
            </div>
        </div>
    </section>

    <!-- ទីតាំង Fetch Footer -->
    <div id="footer-container"></div>

    <script src="script.js"></script>
    <script>
        fetch('More/header.html')
            .then(res => res.text())
            .then(data => {
                document.getElementById('header-container').innerHTML = data;
                setupNavLinks();
                initHeaderEvents();
            });

        fetch('More/footer.html')
            .then(res => res.text())
            .then(data => {
                document.getElementById('footer-container').innerHTML = data;
            });
    </script>
</body>

</html>
