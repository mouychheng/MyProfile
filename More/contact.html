<!DOCTYPE html>
<html lang="km">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ទំនាក់ទំនង - Contact Me</title>
    <link href="https://fonts.googleapis.com/css2?family=Kantumruuy+Pro:wght@300;400;600;700&family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="../style.css">

    <!-- CSS ផ្ទាល់សម្រាប់ទំព័រ Contact -->
    <style>
        .contact-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 30px;
        }

        .contact-info, .contact-form {
            background: var(--card-bg, rgba(255, 255, 255, 0.05));
            border: 1px solid var(--border-color, rgba(0, 210, 255, 0.2));
            padding: 30px;
            border-radius: 15px;
            backdrop-filter: blur(10px);
        }

        .contact-info h3, .contact-form h3 {
            color: var(--primary-sky, #00d2ff);
            margin-bottom: 20px;
            font-size: 1.2rem;
        }

        .contact-info p {
            color: #a8b2d1;
            margin-bottom: 15px;
            font-size: 0.95rem;
        }

        .contact-info i {
            color: var(--primary-sky, #00d2ff);
            margin-right: 10px;
        }

        .social-btn-group {
            margin-top: 25px;
            display: flex;
            gap: 12px;
        }

        .social-btn {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 10px 18px;
            border-radius: 20px;
            text-decoration: none;
            color: #fff;
            font-size: 0.9rem;
            transition: all 0.3s ease;
        }

        .social-btn.tg { background: #0088cc; }
        .social-btn.fb { background: #1877f2; }

        .social-btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 5px 15px rgba(0,0,0,0.3);
        }

        .contact-form input, .contact-form textarea {
            width: 100%;
            padding: 12px;
            margin-bottom: 15px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid var(--border-color, rgba(0, 210, 255, 0.2));
            color: #fff;
            border-radius: 8px;
            outline: none;
        }

        .toast {
            position: fixed;
            bottom: -100px;
            right: 20px;
            background: #10b981;
            color: white;
            padding: 15px 25px;
            border-radius: 10px;
            transition: 0.5s ease;
            z-index: 2000;
        }

        .toast.show { bottom: 20px; }
    </style>
</head>
<body class="dark-mode">
    <canvas id="bg-canvas"></canvas>
    <div id="header-container"></div>

    <main class="page-container" style="padding-top: 110px;">
        <section class="section-title">
            <h2>ទំនាក់ទំនង <span>មកខ្ញុំ</span> (Contact Me)</h2>
            <p>ផ្ញើសារ ឬទាក់ទងមកខ្ញុំតាមបណ្តាញសង្គមខាងក្រោម</p>
        </section>

        <div class="contact-grid">
            <div class="contact-info">
                <h3>ព័ត៌មានទំនាក់ទំនង</h3>
                <p><i class="fa-solid fa-envelope"></i> <strong>Email:</strong> myemail@gmail.com</p>
                <p><i class="fa-solid fa-phone"></i> <strong>Phone:</strong> +855 12 345 678</p>
                
                <div class="social-btn-group">
                    <a href="https://t.me/" target="_blank" class="social-btn tg"><i class="fa-brands fa-telegram"></i> Telegram</a>
                    <a href="https://facebook.com/" target="_blank" class="social-btn fb"><i class="fa-brands fa-facebook"></i> Facebook</a>
                </div>
            </div>

            <form class="contact-form" id="contactForm" onsubmit="handleContactSubmit(event)">
                <h3>ផ្ញើសារមកកាន់ខ្ញុំ</h3>
                <input type="text" id="sender-name" placeholder="ឈ្មោះរបស់អ្នក..." required>
                <input type="email" id="sender-email" placeholder="អ៊ីមែលរបស់អ្នក..." required>
                <textarea id="sender-message" placeholder="អត្ថបទសារ..." rows="5" required></textarea>
                <button type="submit" class="btn btn-primary"><i class="fa-solid fa-paper-plane"></i> ផ្ញើសារ</button>
            </form>
        </div>

        <div id="toast-msg" class="toast">✅ សាររបស់អ្នកត្រូវបានផ្ញើរួចរាល់ដោយជោគជ័យ!</div>
    </main>

    <div id="footer-container"></div>
    <script src="../script.js"></script>
    <script>
        function handleContactSubmit(e) {
            e.preventDefault();
            let toast = document.getElementById('toast-msg');
            toast.classList.add('show');
            document.getElementById('contactForm').reset();
            setTimeout(() => { toast.classList.remove('show'); }, 4000);
        }
        fetch('header.html').then(res => res.text()).then(d => { document.getElementById('header-container').innerHTML = d; setupNavLinks(); initHeaderEvents(); });
        fetch('footer.html').then(res => res.text()).then(d => document.getElementById('footer-container').innerHTML = d);
    </script>
</body>
</html>
