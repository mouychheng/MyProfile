<style>
    /* CSS សម្រាប់ Header & Navbar */
    .navbar {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 18px 8%;
        background: var(--card-bg, rgba(22, 33, 48, 0.85));
        backdrop-filter: blur(12px);
        position: fixed;
        width: 100%;
        top: 0;
        z-index: 1000;
        border-bottom: 1px solid var(--border-color, rgba(0, 210, 255, 0.2));
        box-shadow: 0 4px 20px rgba(0, 0, 0, 0.15);
    }

    .logo {
        font-size: 1.6rem;
        font-weight: 700;
        color: var(--text-color, #e6f1ff);
    }

    .logo span {
        color: var(--primary-sky, #00d2ff);
    }

    .nav-links {
        display: flex;
        list-style: none;
        align-items: center;
        gap: 10px;
    }

    .nav-links li a {
        color: var(--text-color, #e6f1ff);
        text-decoration: none;
        font-size: 0.95rem;
        font-weight: 500;
        padding: 6px 12px;
        border-radius: 8px;
        transition: 0.3s;
    }

    .nav-links li a:hover {
        color: var(--primary-sky, #00d2ff);
        background: rgba(0, 210, 255, 0.08);
    }

    .btn-nav {
        border: 2px solid var(--primary-sky, #00d2ff) !important;
        color: var(--primary-sky, #00d2ff) !important;
        border-radius: 20px !important;
    }

    .btn-nav:hover {
        background: var(--primary-sky, #00d2ff) !important;
        color: #fff !important;
        box-shadow: 0 0 15px var(--accent-glow, rgba(0, 210, 255, 0.4));
    }

    .nav-controls {
        display: flex;
        align-items: center;
        gap: 12px;
    }

    .theme-btn, .hamburger {
        background: transparent;
        border: 1px solid var(--border-color, rgba(0, 210, 255, 0.2));
        color: var(--text-color, #e6f1ff);
        padding: 8px 12px;
        border-radius: 8px;
        cursor: pointer;
        font-size: 1.1rem;
    }

    .theme-btn:hover, .hamburger:hover {
        border-color: var(--primary-sky, #00d2ff);
        color: var(--primary-sky, #00d2ff);
    }

    .hamburger {
        display: none;
    }

    @media (max-width: 900px) {
        .hamburger { display: block; }
        .nav-links {
            position: fixed;
            top: 75px;
            right: -100%;
            flex-direction: column;
            background: var(--bg-dark, #0a1118);
            width: 100%;
            padding: 25px;
            transition: 0.4s ease;
            border-bottom: 1px solid var(--border-color, rgba(0, 210, 255, 0.2));
            box-shadow: 0 10px 25px rgba(0,0,0,0.3);
        }
        .nav-links.active { right: 0; }
        .nav-links li { width: 100%; text-align: center; margin: 5px 0; }
    }
</style>

<nav class="navbar">
    <div class="logo">My<span>Profile</span></div>
    
    <div class="nav-controls">
        <button id="theme-toggle" class="theme-btn" title="ប្តូរម៉ូត ថ្ងៃ/យប់">
            <i class="fa-solid fa-moon"></i>
        </button>
        <button class="hamburger" id="hamburger-btn">
            <i class="fa-solid fa-bars"></i>
        </button>
    </div>

    <ul class="nav-links" id="nav-links">
        <li><a href="#" id="link-home"><i class="fa-solid fa-house"></i> ទំព័រដើម</a></li>
        <li><a href="#" id="link-about"><i class="fa-solid fa-user"></i> អំពីខ្ញុំ</a></li>
        <li><a href="#" id="link-projects"><i class="fa-solid fa-code"></i> ស្នាដៃ & Project</a></li>
        <li><a href="#" id="link-cv"><i class="fa-solid fa-file-pdf"></i> CV Builder</a></li>
        <li><a href="#" id="link-blog"><i class="fa-solid fa-pen-to-square"></i> Blog & Notes</a></li>
        <li><a href="#" class="btn-nav" id="link-contact"><i class="fa-solid fa-paper-plane"></i> ទំនាក់ទំនង</a></li>
    </ul>
</nav>
