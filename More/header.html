<style>
    /* ==========================================
       MODERN HEADER & NAVBAR STYLING (ធំទូលាយ និងច្បាស់)
       ========================================== */
    .navbar {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 20px 6%;
        background: var(--card-bg, rgba(22, 33, 48, 0.92));
        backdrop-filter: blur(15px);
        position: fixed;
        width: 100%;
        top: 0;
        z-index: 1000;
        border-bottom: 1px solid var(--border-color, rgba(0, 210, 255, 0.25));
        box-shadow: 0 4px 25px rgba(0, 0, 0, 0.25);
    }

    /* 1. Logo & Brand ធំល្មមស្អាត */
    .logo-brand {
        display: flex;
        align-items: center;
        gap: 12px;
        text-decoration: none;
        cursor: pointer;
        transition: transform 0.3s ease;
    }

    .logo-brand:hover {
        transform: scale(1.03);
    }

    .logo-icon {
        width: 44px;
        height: 44px;
        background: linear-gradient(135deg, var(--primary-sky, #00d2ff), var(--secondary-sky, #3a7bd5));
        border-radius: 50%;
        display: flex;
        align-items: center;
        justify-content: center;
        color: #fff;
        font-size: 1.25rem;
        box-shadow: 0 0 15px var(--accent-glow, rgba(0, 210, 255, 0.6));
    }

    .logo-text {
        font-size: 1.6rem;
        font-weight: 700;
        color: var(--text-color, #e6f1ff);
        letter-spacing: 0.5px;
    }

    .logo-text span {
        color: var(--primary-sky, #00d2ff);
    }

    /* Navigation Links ធំទូលាយ និងអក្សរច្បាស់ */
    .nav-links {
        display: flex;
        list-style: none;
        align-items: center;
        gap: 12px;
    }

    .nav-links li {
        position: relative;
    }

    .nav-links li a {
        color: var(--text-color, #e6f1ff);
        text-decoration: none;
        font-size: 1.02rem;
        font-weight: 500;
        padding: 9px 16px;
        border-radius: 10px;
        transition: 0.3s;
        display: inline-block;
    }

    .nav-links li a:hover {
        color: var(--primary-sky, #00d2ff);
        background: rgba(0, 210, 255, 0.1);
    }

    /* Active Glow Line */
    .nav-links li a.active-page {
        color: var(--primary-sky, #00d2ff) !important;
        font-weight: 600;
    }

    .nav-links li a.active-page::after {
        content: '';
        position: absolute;
        bottom: -3px;
        left: 14px;
        right: 14px;
        height: 3px;
        background: var(--primary-sky, #00d2ff);
        border-radius: 2px;
        box-shadow: 0 0 12px var(--primary-sky, #00d2ff);
    }

    .btn-nav {
        border: 2px solid var(--primary-sky, #00d2ff) !important;
        color: var(--primary-sky, #00d2ff) !important;
        border-radius: 25px !important;
        padding: 8px 20px !important;
    }

    .btn-nav.active-page::after { display: none; }

    .btn-nav:hover {
        background: var(--primary-sky, #00d2ff) !important;
        color: #fff !important;
        box-shadow: 0 0 18px var(--accent-glow, rgba(0, 210, 255, 0.5));
    }

    /* 2. Smart Search Bar ធំទូលាយ */
    .search-container {
        position: relative;
        display: flex;
        align-items: center;
    }

    .search-input {
        width: 170px;
        padding: 8px 14px 8px 36px;
        background: rgba(255, 255, 255, 0.06);
        border: 1px solid var(--border-color, rgba(0, 210, 255, 0.3));
        border-radius: 25px;
        color: var(--text-color, #e6f1ff);
        font-size: 0.92rem;
        outline: none;
        transition: all 0.3s ease;
    }

    .search-input:focus {
        width: 230px;
        border-color: var(--primary-sky, #00d2ff);
        box-shadow: 0 0 12px rgba(0, 210, 255, 0.3);
    }

    .search-container i {
        position: absolute;
        left: 13px;
        color: var(--text-muted, #8892b0);
        font-size: 0.92rem;
        pointer-events: none;
    }

    /* 3. Controls & Theme Switcher */
    .nav-controls {
        display: flex;
        align-items: center;
        gap: 12px;
    }

    .theme-btn, .hamburger {
        background: transparent;
        border: 1px solid var(--border-color, rgba(0, 210, 255, 0.3));
        color: var(--text-color, #e6f1ff);
        padding: 9px 13px;
        border-radius: 12px;
        cursor: pointer;
        font-size: 1.15rem;
        transition: all 0.3s ease;
    }

    .theme-btn:hover, .hamburger:hover {
        border-color: var(--primary-sky, #00d2ff);
        color: var(--primary-sky, #00d2ff);
        background: rgba(0, 210, 255, 0.12);
    }

    .hamburger { display: none; }

    /* Responsive */
    @media (max-width: 1100px) {
        .hamburger { display: block; }
        .search-container { display: none; }
        .nav-links {
            position: fixed;
            top: 80px;
            right: -100%;
            flex-direction: column;
            background: var(--bg-dark, #0a1118);
            width: 100%;
            padding: 30px;
            transition: 0.4s ease;
            border-bottom: 1px solid var(--border-color, rgba(0, 210, 255, 0.2));
            box-shadow: 0 15px 30px rgba(0,0,0,0.4);
        }
        .nav-links.active { right: 0; }
        .nav-links li { width: 100%; text-align: center; margin: 8px 0; }
    }
</style>

    <!-- Controls (Search, Theme Switcher & Hamburger) -->
    <div class="nav-controls">

        <div class="search-container">

        </div>

        <!-- ៣. Theme Switcher (Dark / Light Mode) -->
        <button id="theme-toggle" class="theme-btn" title="ប្តូរម៉ូត ថ្ងៃ/យប់">
            <i class="fa-solid fa-moon"></i>

        <!-- Mobile Menu Toggle -->

            <i class="fa-solid fa-bars"></i>
